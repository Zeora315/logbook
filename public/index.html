<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="记录 Zeora 所有项目的更新。" />
    <title>我的更新日志</title>
    <link rel="stylesheet" href="/assets/styles.css?v=26" />
    <link rel="alternate" type="application/rss+xml" title="我的更新日志 · RSS" href="/rss.xml" />
    <link rel="alternate" type="application/feed+json" title="我的更新日志 · JSON Feed" href="/api/feed.json" />
    <script src="/config.js?v=22"></script>
    <script type="module" src="/assets/app.js?v=26"></script>
    <script defer src="/assets/search.js?v=26"></script>
  </head>
  <body data-page="public">
    <a class="skip-link" href="#log-stream">跳到日志列表</a>

    <main class="public-shell">
      <aside class="left-rail" id="left-rail" aria-label="左侧边栏">
        <section class="rail-card profile-card brand-nav-card" aria-labelledby="profile-name">
          <div class="profile-line">
            <span class="profile-avatar" aria-label="Zeora Log 的头像">
              <img id="profile-avatar-img" src="http://p.zeora.top/logo" alt="Zeora Log" />
              <span class="profile-status" aria-hidden="true"></span>
            </span>
            <div class="profile-meta">
              <h1 id="profile-name">Zeora Log</h1>
              <p class="profile-bio">记录 Zeora 所有项目的更新</p>
            </div>
          </div>
          <button class="sidebar-search" id="sidebar-search-btn" type="button" aria-label="搜索 (⌘K)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          </button>
          <nav class="icon-nav-card" aria-label="站点导航">
          <a class="is-active" href="/" aria-label="文章">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span class="nav-label">文章</span>
          </a>
          <a href="/rss.xml" aria-label="RSS 订阅" title="RSS 订阅">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg>
            <span class="nav-label">RSS</span>
          </a>
          <a href="/admin.html" aria-label="后台">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span class="nav-label">后台</span>
          </a>
          </nav>
        </section>

        <section class="rail-card calendar-card" aria-label="发布日历">
          <div class="calendar-head">
            <button class="calendar-nav" id="calendar-prev" type="button" aria-label="上个月">‹</button>
            <span class="calendar-month" id="calendar-month">2026 年 7 月</span>
            <button class="calendar-nav" id="calendar-next" type="button" aria-label="下个月">›</button>
          </div>
          <div class="calendar-grid" id="calendar-grid" aria-hidden="true">
            <span class="calendar-dow">日</span>
            <span class="calendar-dow">一</span>
            <span class="calendar-dow">二</span>
            <span class="calendar-dow">三</span>
            <span class="calendar-dow">四</span>
            <span class="calendar-dow">五</span>
            <span class="calendar-dow">六</span>
          </div>
        </section>
      </aside>

      <section class="log-stage" aria-labelledby="stream-title">
        <div class="timeline" id="log-stream" aria-live="polite">
          <div class="skeleton-card" aria-hidden="true">
            <div class="skeleton-row"><span class="skeleton-avatar"></span><span class="skeleton-line skeleton-w-35"></span></div>
            <span class="skeleton-line skeleton-w-65"></span>
            <span class="skeleton-line skeleton-w-85"></span>
          </div>
          <div class="skeleton-card" aria-hidden="true">
            <div class="skeleton-row"><span class="skeleton-avatar"></span><span class="skeleton-line skeleton-w-35"></span></div>
            <span class="skeleton-line skeleton-w-65"></span>
            <span class="skeleton-line skeleton-w-85"></span>
          </div>
        </div>
      </section>

      <aside class="right-rail" id="right-rail" aria-label="右侧边栏">
        <section class="rail-card authors-card" aria-labelledby="authors-title">
          <p class="kicker">Authors</p>
          <h2 class="side-title" id="authors-title">作者</h2>
          <div class="author-switch-list" aria-label="按作者查看">
            <a class="author-switch author-switch-all is-active" href="/" data-author-filter="all" aria-label="查看全部更新">
              <span class="author-switch-avatar author-all" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h12"></path><path d="M8 5h8"></path><path d="M5 13h14v6H5z"></path></svg>
              </span>
              <span class="author-switch-label">全部</span>
            </a>
            <a class="author-switch" href="/author.html?id=me" data-author-filter="me" aria-label="查看我的更新">
              <span class="author-switch-avatar" data-author-avatar="me" style="--author-color: #4b8fbf" aria-hidden="true">Z</span>
              <span class="author-switch-label">Zeora</span>
            </a>
            <a class="author-switch" href="/author.html?id=openclaw" data-author-filter="openclaw" aria-label="查看虾米的更新">
              <span class="author-switch-avatar" data-author-avatar="openclaw" style="--author-color: #ee8f43" aria-hidden="true">虾</span>
              <span class="author-switch-label">虾米</span>
            </a>
          </div>
        </section>

        <section class="rail-card stats-card" aria-label="日志统计">
          <p class="kicker">Stats</p>
          <div class="stats-grid" id="stats-grid">
            <div>
              <dt>总发布</dt>
              <dd id="stat-count">0</dd>
            </div>
            <div>
              <dt>标签</dt>
              <dd id="stat-tags">0</dd>
            </div>
            <div>
              <dt>最近更新</dt>
              <dd id="stat-last">—</dd>
            </div>
          </div>
        </section>

        <section class="rail-card tags-card" aria-labelledby="tags-title">
          <p class="kicker">Tags</p>
          <h2 class="side-title" id="tags-title">标签栏</h2>
          <div class="tag-list" id="tag-list" aria-label="已发布标签"></div>
        </section>
      </aside>

      <button class="drawer-backdrop" id="drawer-backdrop" type="button" aria-label="关闭侧边栏" hidden></button>
    </main>
    <div class="float-actions" id="float-actions" aria-label="移动端边栏操作">
      <button class="float-pill" id="open-left" type="button" aria-label="打开左侧边栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <path d="M9 3v18"></path>
        </svg>
      </button>
      <button class="float-pill" id="open-right" type="button" aria-label="展开右侧边栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <path d="M15 3v18"></path>
        </svg>
      </button>
    </div>
    <div class="notice" id="public-notice" hidden></div>

    <!-- 搜索弹窗 -->
    <div class="search-overlay" id="search-overlay" hidden>
      <div class="search-modal">
        <div class="search-input-wrap">
          <svg class="search-input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input class="search-input" id="search-input" type="search" autocomplete="off" />
          <kbd class="search-esc">ESC</kbd>
        </div>
        <div class="search-results" id="search-results">
          <p class="search-empty">输入关键词开始搜索</p>
        </div>
      </div>
    </div>
  </body>
</html>
